<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claude Mastery — Build &amp; Architect Exam Prep</title>
    <meta
      name="description"
      content="An interactive learning app for the Building with the Claude API course and the Claude Certified Architect – Foundations exam."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply persisted theme before first paint to avoid a flash.
      // Theme is device-global in cma:theme; fall back to legacy v1, then OS preference.
      try {
        var theme = null
        var t = localStorage.getItem('cma:theme')
        if (t) theme = JSON.parse(t)
        if (theme !== 'light' && theme !== 'dark') {
          var raw = localStorage.getItem('claude-mastery:v1')
          theme = raw ? JSON.parse(raw).theme : null
        }
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        if (theme === 'dark') document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
